<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no,
        viewport-fit=cover">

    <title>Mayan Sculpture AR</title>

    <!-- MODEL VIEWER -->
    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;

            background: #111;
            color: white;

            font-family: Arial, sans-serif;
        }

        body {
            touch-action: manipulation;
        }

        /* =========================================
           APP
        ========================================= */

        .app {
            position: relative;

            width: 100%;
            height: 100dvh;

            overflow: hidden;

            background: #111;
        }


        /* =========================================
           HEADER
        ========================================= */

        header {
            position: absolute;

            top: env(safe-area-inset-top, 0);
            left: 0;

            width: 100%;

            z-index: 20;

            padding: 15px 16px 12px;

            text-align: center;

            pointer-events: none;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0,0,0,.75),
                    rgba(0,0,0,0)
                );
        }

        header h1 {
            margin: 0;

            font-size: 22px;
            font-weight: 700;
        }

        header p {
            margin: 5px 0 0;

            color: #ccc;

            font-size: 12px;
        }


        /* =========================================
           3D VIEWER
        ========================================= */

        .viewer {
            position: absolute;

            inset: 0;
        }

        model-viewer {

            width: 100%;
            height: 100%;

            background: #181818;

            --poster-color: #181818;

            touch-action: none;

        }


        /* =========================================
           AR BUTTON
        ========================================= */

        .ar-button {

            position: absolute;

            left: 50%;
            bottom: 125px;

            transform: translateX(-50%);

            border: none;

            border-radius: 18px;

            padding: 14px 24px;

            background: #d9a441;

            color: #111;

            font-size: 15px;

            font-weight: 800;

            white-space: nowrap;

            box-shadow:
                0 5px 20px rgba(0,0,0,.45);

            cursor: pointer;

            touch-action: manipulation;
        }

        .ar-button:active {

            transform:
                translateX(-50%)
                scale(.95);

        }


        /* =========================================
           ROTATION CUBE
        ========================================= */

        .cube-control {

            position: absolute;

            left: 15px;

            bottom:
                calc(
                    18px +
                    env(safe-area-inset-bottom, 0px)
                );

            z-index: 30;

            width: 62px;
            height: 62px;

            border: none;

            border-radius: 17px;

            background:
                rgba(0,0,0,.78);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            color: white;

            display: flex;

            align-items: center;
            justify-content: center;

            cursor: pointer;

            box-shadow:
                0 5px 20px rgba(0,0,0,.35);

            touch-action: manipulation;

        }

        .cube-control:active {

            transform: scale(.90);

        }


        /* =========================================
           CUBE
        ========================================= */

        .cube {

            position: relative;

            width: 34px;
            height: 34px;

            transform-style: preserve-3d;

            transform:
                rotateX(-25deg)
                rotateY(35deg);

            transition:
                transform .35s ease;

        }

        .cube-face {

            position: absolute;

            width: 34px;
            height: 34px;

            border: 2px solid #111;

            background: #d9a441;

            opacity: .95;

        }

        .cube-front {
            transform:
                translateZ(17px);
        }

        .cube-back {
            transform:
                rotateY(180deg)
                translateZ(17px);
        }

        .cube-right {
            transform:
                rotateY(90deg)
                translateZ(17px);
            background: #b78327;
        }

        .cube-left {
            transform:
                rotateY(-90deg)
                translateZ(17px);
            background: #e5bd67;
        }

        .cube-top {
            transform:
                rotateX(90deg)
                translateZ(17px);
            background: #f0cf83;
        }

        .cube-bottom {
            transform:
                rotateX(-90deg)
                translateZ(17px);
            background: #8d651e;
        }


        /* =========================================
           CAMERA BUTTON
        ========================================= */

        .camera-button {

            position: absolute;

            right: 15px;

            bottom:
                calc(
                    18px +
                    env(safe-area-inset-bottom, 0px)
                );

            z-index: 30;

            width: 62px;
            height: 62px;

            border: none;

            border-radius: 17px;

            background: white;

            color: #111;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 27px;

            cursor: pointer;

            box-shadow:
                0 5px 20px rgba(0,0,0,.4);

            touch-action: manipulation;

        }

        .camera-button:active {

            transform: scale(.90);

        }


        /* =========================================
           CAMERA FLASH
        ========================================= */

        .flash {

            position: absolute;

            inset: 0;

            z-index: 100;

            background: white;

            opacity: 0;

            pointer-events: none;

        }

        .flash.active {

            animation: cameraFlash .25s ease;

        }

        @keyframes cameraFlash {

            0% {
                opacity: 0;
            }

            35% {
                opacity: .85;
            }

            100% {
                opacity: 0;
            }

        }


        /* =========================================
           STATUS MESSAGE
        ========================================= */

        .status {

            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            z-index: 80;

            display: none;

            max-width: 85%;

            padding: 13px 17px;

            border-radius: 15px;

            background:
                rgba(0,0,0,.88);

            color: white;

            font-size: 13px;

            line-height: 1.4;

            text-align: center;

        }

        .status.show {

            display: block;

        }


        /* =========================================
           SMALL INSTRUCTION
        ========================================= */

        .help {

            position: absolute;

            left: 50%;

            bottom: 95px;

            transform:
                translateX(-50%);

            z-index: 15;

            color:
                rgba(255,255,255,.72);

            font-size: 11px;

            white-space: nowrap;

            pointer-events: none;

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 500px) {

            header h1 {
                font-size: 20px;
            }

            header p {
                font-size: 11px;
            }

            .cube-control,
            .camera-button {

                width: 56px;
                height: 56px;

                border-radius: 15px;

            }

            .cube {
                width: 30px;
                height: 30px;
            }

            .cube-face {
                width: 30px;
                height: 30px;
            }

            .cube-front,
            .cube-back {
                transform:
                    translateZ(15px);
            }

            .cube-right {
                transform:
                    rotateY(90deg)
                    translateZ(15px);
            }

            .cube-left {
                transform:
                    rotateY(-90deg)
                    translateZ(15px);
            }

            .cube-top {
                transform:
                    rotateX(90deg)
                    translateZ(15px);
            }

            .cube-bottom {
                transform:
                    rotateX(-90deg)
                    translateZ(15px);
            }

            .ar-button {

                bottom: 115px;

                padding:
                    13px 20px;

            }

            .help {
                bottom: 88px;
            }

        }

    </style>

</head>


<body>


<div class="app">


    <!-- HEADER -->

    <header>

        <h1>Mayan Sculpture</h1>

        <p>
            Explore the sculpture in augmented reality
        </p>

    </header>


    <!-- VIEWER -->

    <div class="viewer">


        <model-viewer

            id="model"

            src="./escultura.glb"

            alt="Mayan sculpture"

            ar

            ar-modes="webxr scene-viewer quick-look"

            camera-controls

            touch-action="none"

            shadow-intensity="1"

            shadow-softness="0.7"

            exposure="1"

            environment-image="neutral"

            interaction-prompt="auto"

            camera-orbit="0deg 75deg 3m"

            min-camera-orbit="auto 10deg 0.6m"

            max-camera-orbit="auto 170deg 10m"

            field-of-view="30deg"

            loading="eager">


            <!-- AR BUTTON -->

            <button

                slot="ar-button"

                class="ar-button"

                id="enterAR">

                📱 VIEW IN MY SPACE

            </button>


        </model-viewer>


        <!-- =====================================
             ROTATION CUBE
        ====================================== -->

        <button

            id="cubeButton"

            class="cube-control"

            aria-label="Rotate sculpture"

            title="Rotate sculpture">


            <div class="cube">

                <div class="cube-face cube-front"></div>

                <div class="cube-face cube-back"></div>

                <div class="cube-face cube-right"></div>

                <div class="cube-face cube-left"></div>

                <div class="cube-face cube-top"></div>

                <div class="cube-face cube-bottom"></div>

            </div>


        </button>


        <!-- =====================================
             CAMERA
        ====================================== -->

        <button

            id="cameraButton"

            class="camera-button"

            aria-label="Take photo"

            title="Take photo">

            📷

        </button>


        <!-- CAMERA FLASH -->

        <div
            id="flash"
            class="flash">
        </div>


        <!-- STATUS -->

        <div
            id="status"
            class="status">
        </div>


        <!-- HELP -->

        <div class="help">

            Drag to rotate · Pinch to zoom

        </div>


    </div>


</div>


<script>

    /* =========================================
       ELEMENTS
    ========================================= */

    const model =
        document.getElementById("model");

    const cubeButton =
        document.getElementById("cubeButton");

    const cameraButton =
        document.getElementById("cameraButton");

    const flash =
        document.getElementById("flash");

    const status =
        document.getElementById("status");


    /* =========================================
       DEFAULT CAMERA
    ========================================= */

    const DEFAULT_ORBIT =
        "0deg 75deg 3m";


    /* =========================================
       STATUS
    ========================================= */

    function showStatus(
        message,
        duration = 2500
    ) {

        status.textContent =
            message;

        status.classList.add(
            "show"
        );

        clearTimeout(
            showStatus.timer
        );

        showStatus.timer =
            setTimeout(() => {

                status.classList.remove(
                    "show"
                );

            }, duration);

    }


    /* =========================================
       ROTATE SCULPTURE
    ========================================= */

    function rotateSculpture(
        horizontal,
        vertical
    ) {

        const orbit =
            model.getCameraOrbit();

        if (!orbit) {
            return;
        }


        let theta =
            orbit.theta +
            horizontal;


        let phi =
            orbit.phi +
            vertical;


        /*
         * Keep vertical rotation
         * inside a safe range.
         */

        const minPhi =
            10 * Math.PI / 180;

        const maxPhi =
            170 * Math.PI / 180;


        phi =
            Math.max(
                minPhi,
                Math.min(
                    maxPhi,
                    phi
                )
            );


        model.cameraOrbit =
            `${theta}rad ` +
            `${phi}rad ` +
            `${orbit.radius}m`;

    }


    /* =========================================
       CUBE BUTTON
       
       Each tap rotates the sculpture
       around its vertical axis.
    ========================================= */

    let cubeRotation = 35;


    cubeButton.addEventListener(
        "click",
        () => {

            const step =
                45 *
                Math.PI /
                180;


            rotateSculpture(
                step,
                0
            );


            cubeRotation += 45;


            cubeButton
                .querySelector(".cube")
                .style.transform =
                    `rotateX(-25deg)
                     rotateY(${cubeRotation}deg)`;

        }
    );


    /* =========================================
       CAMERA / PHOTO
    ========================================= */

    async function takePhoto() {

        try {

            /*
             * model-viewer creates an image
             * of the 3D viewer.
             */

            if (
                typeof model.toBlob !==
                "function"
            ) {

                throw new Error(
                    "Photo capture unavailable"
                );

            }


            const blob =
                await model.toBlob({

                    idealAspect: 1,

                    mimeType:
                        "image/png"

                });


            if (!blob) {

                throw new Error(
                    "Image creation failed"
                );

            }


            /*
             * Flash effect
             */

            flash.classList.remove(
                "active"
            );

            void flash.offsetWidth;

            flash.classList.add(
                "active"
            );


            /*
             * Download image
             */

            const url =
                URL.createObjectURL(
                    blob
                );


            const link =
                document.createElement(
                    "a"
                );


            link.href = url;

            link.download =
                `mayan-sculpture-${Date.now()}.png`;


            document.body.appendChild(
                link
            );

            link.click();

            link.remove();


            setTimeout(
                () => {

                    URL.revokeObjectURL(
                        url
                    );

                },
                2000
            );


            showStatus(
                "Photo saved"
            );


        } catch (error) {

            console.error(error);

            showStatus(
                "Photo capture is not available in this browser.",
                4000
            );

        }

    }


    cameraButton.addEventListener(
        "click",
        takePhoto
    );


    /* =========================================
       RESET WITH DOUBLE TAP ON CUBE
    ========================================= */

    let lastCubeTap = 0;


    cubeButton.addEventListener(
        "click",
        () => {

            const now =
                Date.now();


            if (
                now - lastCubeTap <
                500
            ) {

                model.cameraOrbit =
                    DEFAULT_ORBIT;

                model.fieldOfView =
                    "30deg";


                cubeRotation = 35;


                cubeButton
                    .querySelector(".cube")
                    .style.transform =
                        "rotateX(-25deg) rotateY(35deg)";


                showStatus(
                    "View centered"
                );

            }


            lastCubeTap = now;

        }
    );


    /* =========================================
       MODEL LOADED
    ========================================= */

    model.addEventListener(
        "load",
        () => {

            model.cameraOrbit =
                DEFAULT_ORBIT;

        }
    );


    /* =========================================
       MODEL ERROR
    ========================================= */

    model.addEventListener(
        "error",
        () => {

            showStatus(
                "Unable to load escultura.glb",
                5000
            );

            console.error(
                "Unable to load escultura.glb"
            );

        }
    );


    /* =========================================
       AR STATUS
    ========================================= */

    model.addEventListener(
        "ar-status",
        event => {

            console.log(
                "AR status:",
                event.detail
            );

        }
    );

</script>


</body>

</html>
