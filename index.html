<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>Mayan Sculpture AR</title>

<script type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
</script>

<style>

/* =====================================================
   GENERAL
===================================================== */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#111;
    color:white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

body{
    touch-action:manipulation;
}

.app{
    position:relative;

    width:100%;
    height:100dvh;

    overflow:hidden;

    background:#181818;
}


/* =====================================================
   HEADER
===================================================== */

header{

    position:absolute;

    top:
        env(
            safe-area-inset-top,
            0px
        );

    left:0;

    width:100%;

    z-index:20;

    padding:
        16px
        16px
        20px;

    text-align:center;

    pointer-events:none;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.82),
            rgba(0,0,0,0)
        );
}

header h1{

    margin:0;

    font-size:22px;

    font-weight:700;

    letter-spacing:.2px;
}

header p{

    margin:5px 0 0;

    color:#cfcfcf;

    font-size:12px;
}


/* =====================================================
   3D VIEWER
===================================================== */

.viewer{

    position:absolute;

    inset:0;
}

model-viewer{

    width:100%;
    height:100%;

    background:#181818;

    --poster-color:#181818;

    touch-action:none;
}


/* =====================================================
   AR BUTTON
===================================================== */

.ar-button{

    position:absolute;

    left:50%;

    bottom:
        calc(
            112px +
            env(
                safe-area-inset-bottom,
                0px
            )
        );

    transform:
        translateX(-50%);

    border:0;

    border-radius:18px;

    padding:
        14px
        24px;

    background:#d9a441;

    color:#111;

    font-size:15px;

    font-weight:800;

    box-shadow:
        0 5px 22px
        rgba(0,0,0,.45);

    white-space:nowrap;

    cursor:pointer;

    touch-action:manipulation;
}


/* =====================================================
   HELP
===================================================== */

.help{

    position:absolute;

    left:50%;

    bottom:
        calc(
            78px +
            env(
                safe-area-inset-bottom,
                0px
            )
        );

    transform:
        translateX(-50%);

    z-index:15;

    color:
        rgba(
            255,
            255,
            255,
            .68
        );

    font-size:11px;

    white-space:nowrap;

    pointer-events:none;
}


/* =====================================================
   BOTTOM BAR
===================================================== */

.bottom-bar{

    position:absolute;

    left:50%;

    bottom:
        calc(
            12px +
            env(
                safe-area-inset-bottom,
                0px
            )
        );

    transform:
        translateX(-50%);

    z-index:30;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:7px;

    padding:8px;

    border-radius:21px;

    background:
        rgba(
            0,
            0,
            0,
            .82
        );

    backdrop-filter:
        blur(12px);

    -webkit-backdrop-filter:
        blur(12px);
}


/* =====================================================
   BUTTONS
===================================================== */

.button{

    width:46px;
    height:46px;

    border:0;

    border-radius:13px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#303030;

    color:white;

    font-size:20px;

    font-weight:bold;

    cursor:pointer;

    user-select:none;

    -webkit-user-select:none;

    touch-action:manipulation;
}

.button:active{

    transform:scale(.91);
}

.button.photo{

    background:white;

    color:#111;

}

.button.auto{

    background:#303030;
}

.button.auto.active{

    background:#d9a441;

    color:#111;
}


/* =====================================================
   AR OVERLAY
===================================================== */

#arInterface{

    display:none;

    position:fixed;

    inset:0;

    z-index:1000;

    pointer-events:none;
}

body.in-ar #arInterface{

    display:block;
}


/* =====================================================
   AR TITLE
===================================================== */

.ar-title{

    position:absolute;

    top:
        calc(
            14px +
            env(
                safe-area-inset-top,
                0px
            )
        );

    left:50%;

    transform:
        translateX(-50%);

    padding:
        8px
        14px;

    border-radius:18px;

    background:
        rgba(
            0,
            0,
            0,
            .68
        );

    backdrop-filter:
        blur(10px);

    -webkit-backdrop-filter:
        blur(10px);

    font-size:11px;

    white-space:nowrap;
}


/* =====================================================
   AR BOTTOM CONTROLS
===================================================== */

.ar-controls{

    position:absolute;

    left:0;
    right:0;

    bottom:
        calc(
            18px +
            env(
                safe-area-inset-bottom,
                0px
            )
        );

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:
        0
        16px;
}


/* =====================================================
   ROTATION CUBE
===================================================== */

.cube-button{

    width:62px;
    height:62px;

    padding:0;

    border:0;

    border-radius:17px;

    background:
        rgba(
            0,
            0,
            0,
            .82
        );

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.45);

    display:flex;

    align-items:center;
    justify-content:center;

    pointer-events:auto;

    touch-action:none;
}

.cube-scene{

    width:38px;
    height:38px;

    perspective:160px;
}

.cube{

    width:34px;
    height:34px;

    position:relative;

    transform-style:preserve-3d;

    transform:
        rotateX(-25deg)
        rotateY(35deg);

}

.face{

    position:absolute;

    width:34px;
    height:34px;

    border:
        2px solid
        #111;

    background:#d9a441;
}

.front{
    transform:
        translateZ(17px);
}

.back{
    transform:
        rotateY(180deg)
        translateZ(17px);
}

.right{
    transform:
        rotateY(90deg)
        translateZ(17px);

    background:#b78327;
}

.left{
    transform:
        rotateY(-90deg)
        translateZ(17px);

    background:#e7c36f;
}

.top{
    transform:
        rotateX(90deg)
        translateZ(17px);

    background:#f1d58f;
}

.bottom{
    transform:
        rotateX(-90deg)
        translateZ(17px);

    background:#8d651f;
}


/* =====================================================
   CAMERA BUTTON
===================================================== */

.camera-button{

    width:62px;
    height:62px;

    border:0;

    border-radius:50%;

    background:white;

    color:#111;

    font-size:27px;

    display:flex;

    align-items:center;
    justify-content:center;

    pointer-events:auto;

    touch-action:manipulation;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.45);

    cursor:pointer;
}

.camera-button:active{

    transform:scale(.9);
}


/* =====================================================
   FLASH
===================================================== */

#flash{

    position:fixed;

    inset:0;

    z-index:2000;

    background:white;

    opacity:0;

    pointer-events:none;
}

#flash.active{

    animation:
        cameraFlash
        .25s
        ease;
}

@keyframes cameraFlash{

    0%{
        opacity:0;
    }

    35%{
        opacity:.9;
    }

    100%{
        opacity:0;
    }
}


/* =====================================================
   STATUS MESSAGE
===================================================== */

#status{

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(
            -50%,
            -50%
        );

    z-index:3000;

    display:none;

    width:max-content;

    max-width:85%;

    padding:
        13px
        17px;

    border-radius:15px;

    background:
        rgba(
            0,
            0,
            0,
            .9
        );

    color:white;

    font-size:13px;

    line-height:1.4;

    text-align:center;
}

#status.show{

    display:block;
}


/* =====================================================
   SMALL SCREENS
===================================================== */

@media(max-width:390px){

    .button{

        width:42px;
        height:42px;

        font-size:18px;
    }

    .bottom-bar{

        gap:5px;
        padding:7px;
    }

    .cube-button,
    .camera-button{

        width:56px;
        height:56px;
    }

    .ar-button{

        padding:
            13px
            19px;
    }
}

</style>

</head>


<body>


<div class="app">


<!-- ===================================================
     HEADER
=================================================== -->

<header>

<h1>Mayan Sculpture</h1>

<p>
Explore the sculpture in augmented reality
</p>

</header>


<!-- ===================================================
     3D VIEWER
=================================================== -->

<div class="viewer">


<model-viewer

id="model"

src="./escultura.glb"

alt="Mayan sculpture"

ar

ar-modes="
webxr
scene-viewer
quick-look
"

ar-placement="floor"

ar-scale="auto"

camera-controls

touch-action="none"

shadow-intensity="1"

shadow-softness="0.7"

exposure="1"

environment-image="neutral"

interaction-prompt="auto"

camera-orbit="
0deg
75deg
3m
"

min-camera-orbit="
auto
10deg
0.6m
"

max-camera-orbit="
auto
170deg
10m
"

field-of-view="30deg"

loading="eager">


<!-- AR BUTTON -->

<button

slot="ar-button"

id="enterAR"

class="ar-button">

📱 VIEW IN MY SPACE

</button>


</model-viewer>


<!-- ===================================================
     NORMAL VIEW CONTROLS
=================================================== -->

<div class="bottom-bar">


<button
class="button"
id="reset"
aria-label="Reset">

🎯

</button>


<button
class="button"
id="rotateLeft"
aria-label="Rotate left">

↶

</button>


<button
class="button"
id="rotateRight"
aria-label="Rotate right">

↷

</button>


<button
class="button"
id="zoomOut"
aria-label="Zoom out">

−

</button>


<button
class="button"
id="zoomIn"
aria-label="Zoom in">

+

</button>


<button
class="button auto"
id="autoRotate"
aria-label="Auto rotate">

▶

</button>


</div>


<div class="help">

Drag to rotate · Pinch to zoom

</div>


</div>


<!-- ===================================================
     AR INTERFACE
=================================================== -->

<div id="arInterface">


<div class="ar-title">

Mayan Sculpture · AR

</div>


<div class="ar-controls">


<!-- ROTATION CUBE -->

<button
id="cubeButton"
class="cube-button"
aria-label="Rotate sculpture">


<div class="cube-scene">


<div
id="cube"
class="cube">

<div class="face front"></div>

<div class="face back"></div>

<div class="face right"></div>

<div class="face left"></div>

<div class="face top"></div>

<div class="face bottom"></div>

</div>

</div>

</button>


<!-- CAMERA -->

<button
id="cameraButton"
class="camera-button"
aria-label="Take photo">

📷

</button>


</div>


</div>


<!-- FLASH -->

<div id="flash"></div>


<!-- STATUS -->

<div id="status"></div>


</div>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const model =
document.getElementById(
    "model"
);

const resetButton =
document.getElementById(
    "reset"
);

const rotateLeftButton =
document.getElementById(
    "rotateLeft"
);

const rotateRightButton =
document.getElementById(
    "rotateRight"
);

const zoomInButton =
document.getElementById(
    "zoomIn"
);

const zoomOutButton =
document.getElementById(
    "zoomOut"
);

const autoButton =
document.getElementById(
    "autoRotate"
);

const cubeButton =
document.getElementById(
    "cubeButton"
);

const cube =
document.getElementById(
    "cube"
);

const cameraButton =
document.getElementById(
    "cameraButton"
);

const flash =
document.getElementById(
    "flash"
);

const status =
document.getElementById(
    "status"
);


/* =====================================================
   STATUS
===================================================== */

let statusTimer = null;

function showStatus(
    message,
    duration = 2500
){

    status.textContent =
        message;

    status.classList.add(
        "show"
    );

    clearTimeout(
        statusTimer
    );

    statusTimer =
        setTimeout(
            () => {

                status.classList.remove(
                    "show"
                );

            },
            duration
        );
}


/* =====================================================
   RESET
===================================================== */

const DEFAULT_ORBIT =
    "0deg 75deg 3m";


function resetView(){

    model.cameraOrbit =
        DEFAULT_ORBIT;

    model.fieldOfView =
        "30deg";
}


resetButton.addEventListener(
    "click",
    resetView
);


/* =====================================================
   ROTATION
===================================================== */

function rotateModel(
    degrees
){

    const orbit =
        model.getCameraOrbit();

    const theta =
        orbit.theta +
        degrees *
        Math.PI /
        180;

    model.cameraOrbit =
        `${theta}rad ` +
        `${orbit.phi}rad ` +
        `${orbit.radius}m`;
}


rotateLeftButton.addEventListener(
    "click",
    () => {

        rotateModel(-30);

    }
);


rotateRightButton.addEventListener(
    "click",
    () => {

        rotateModel(30);

    }
);


/* =====================================================
   ZOOM
===================================================== */

function changeZoom(
    multiplier
){

    const orbit =
        model.getCameraOrbit();

    let radius =
        orbit.radius *
        multiplier;

    radius =
        Math.max(
            .6,
            Math.min(
                10,
                radius
            )
        );

    model.cameraOrbit =
        `${orbit.theta}rad ` +
        `${orbit.phi}rad ` +
        `${radius}m`;
}


zoomInButton.addEventListener(
    "click",
    () => {

        changeZoom(.82);

    }
);


zoomOutButton.addEventListener(
    "click",
    () => {

        changeZoom(1.22);

    }
);


/* =====================================================
   AUTO ROTATION
===================================================== */

let autoActive =
    false;


autoButton.addEventListener(
    "click",
    () => {

        autoActive =
            !autoActive;


        if(autoActive){

            model.setAttribute(
                "auto-rotate",
                ""
            );

            model.setAttribute(
                "rotation-per-second",
                "20deg"
            );

            autoButton.textContent =
                "⏸";

            autoButton.classList.add(
                "active"
            );

        }else{

            model.removeAttribute(
                "auto-rotate"
            );

            autoButton.textContent =
                "▶";

            autoButton.classList.remove(
                "active"
            );
        }

    }
);


/* =====================================================
   AR STATUS
===================================================== */

model.addEventListener(
    "ar-status",
    event => {

        console.log(
            "AR status:",
            event.detail
        );


        if(
            event.detail.status ===
            "session-started"
        ){

            document.body.classList.add(
                "in-ar"
            );

        }


        if(
            event.detail.status ===
            "not-presenting"
        ){

            document.body.classList.remove(
                "in-ar"
            );

        }

    }
);


/* =====================================================
   MODEL LOAD
===================================================== */

model.addEventListener(
    "load",
    () => {

        resetView();

    }
);


/* =====================================================
   MODEL ERROR
===================================================== */

model.addEventListener(
    "error",
    () => {

        showStatus(
            "Could not load escultura.glb",
            5000
        );

    }
);


/* =====================================================
   CUBE → ROTATE MODEL
===================================================== */

let dragging =
    false;

let lastX = 0;
let lastY = 0;

let cubeRotationX =
    -25;

let cubeRotationY =
    35;


cubeButton.addEventListener(
    "pointerdown",
    event => {

        dragging =
            true;

        lastX =
            event.clientX;

        lastY =
            event.clientY;

        cubeButton.setPointerCapture?.(
            event.pointerId
        );

    }
);


cubeButton.addEventListener(
    "pointermove",
    event => {

        if(!dragging){
            return;
        }


        const dx =
            event.clientX -
            lastX;

        const dy =
            event.clientY -
            lastY;


        lastX =
            event.clientX;

        lastY =
            event.clientY;


        /*
         * Rotate the sculpture.
         */

        const orbit =
            model.getCameraOrbit();

        if(orbit){

            const newTheta =
                orbit.theta +
                dx *
                0.012;

            const newPhi =
                Math.max(
                    0.15,
                    Math.min(
                        2.95,
                        orbit.phi +
                        dy *
                        0.012
                    )
                );

            model.cameraOrbit =
                `${newTheta}rad ` +
                `${newPhi}rad ` +
                `${orbit.radius}m`;

        }


        /*
         * Rotate the visual cube.
         */

        cubeRotationY +=
            dx * .7;

        cubeRotationX -=
            dy * .7;


        cubeRotationX =
            Math.max(
                -80,
                Math.min(
                    80,
                    cubeRotationX
                )
            );


        cube.style.transform =
            `rotateX(${cubeRotationX}deg)
             rotateY(${cubeRotationY}deg)`;

    }
);


function stopCubeDrag(){

    dragging =
        false;
}


cubeButton.addEventListener(
    "pointerup",
    stopCubeDrag
);

cubeButton.addEventListener(
    "pointercancel",
    stopCubeDrag
);


/* =====================================================
   PHOTO
===================================================== */

async function takePhoto(){

    /*
     * Flash effect.
     */

    flash.classList.remove(
        "active"
    );

    void flash.offsetWidth;

    flash.classList.add(
        "active"
    );


    /*
     * Try model-viewer capture.
     *
     * This captures the rendered
     * model. Complete camera +
     * environment capture requires
     * browser WebXR capture support.
     */

    try{

        if(
            typeof model.toBlob !==
            "function"
        ){

            throw new Error(
                "toBlob unavailable"
            );
        }


        const blob =
            await model.toBlob({

                idealAspect:1,

                mimeType:
                    "image/png"

            });


        if(!blob){

            throw new Error(
                "Empty image"
            );
        }


        downloadPhoto(
            blob
        );


    }catch(error){

        console.error(
            error
        );

        showStatus(
            "Photo capture is not available on this browser.",
            4000
        );

    }

}


/* =====================================================
   DOWNLOAD PHOTO
===================================================== */

function downloadPhoto(
    blob
){

    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href =
        url;


    link.download =
        `mayan-sculpture-${Date.now()}.png`;


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();


    setTimeout(
        () => {

            URL.revokeObjectURL(
                url
            );

        },
        3000
    );


    showStatus(
        "Photo saved."
    );

}


cameraButton.addEventListener(
    "click",
    takePhoto
);


/* =====================================================
   PAGE VISIBILITY
===================================================== */

document.addEventListener(
    "visibilitychange",
    () => {

        if(
            document.hidden &&
            autoActive
        ){

            model.removeAttribute(
                "auto-rotate"
            );

        }

    }
);


/* =====================================================
   INITIALIZATION
===================================================== */

model.addEventListener(
    "load",
    () => {

        model.cameraOrbit =
            DEFAULT_ORBIT;

        model.fieldOfView =
            "30deg";

    }
);

</script>

</body>

</html>
