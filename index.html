<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>AR Sculpture Gallery</title>
  <link rel="stylesheet" href="style.css" />

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <aside id="nav-panel" aria-label="Navigation">
      <div id="nav-cube-container"></div>
      <div id="nav-label">Sculpture</div>
    </aside>

    <main id="ar-panel" aria-label="Augmented reality view">
      <video id="camera-video" autoplay playsinline muted></video>
      <div id="ar-canvas-container"></div>

      <div id="ar-overlay">
        <div id="loading">
          <div class="spinner"></div>
          <div>Starting camera…</div>
        </div>
        <div id="fallback" class="hidden"></div>
      </div>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
