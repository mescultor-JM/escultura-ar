<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"> <title>Mayan Sculpture AR</title> <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script> <style> *{box-sizing:border-box;-webkit-tap-highlight-color:transparent} html,body{ margin:0; width:100%; height:100%; overflow:hidden; background:#111; font-family:Arial,sans-serif; } body{touch-action:manipulation} #app{ position:relative; width:100%; height:100dvh; overflow:hidden; } model-viewer{ position:absolute; inset:0; width:100%; height:100%; background:#181818; --poster-color:#181818; touch-action:none; } /* HEADER */ header{ position:absolute; top:env(safe-area-inset-top,0); left:0; width:100%; z-index:10; padding:16px; text-align:center; pointer-events:none; color:white; background:linear-gradient(to bottom,rgba(0,0,0,.8),transparent); } header h1{ margin:0; font-size:21px; } header p{ margin:5px 0 0; color:#ccc; font-size:12px; } /* VIEW IN MY SPACE */ #arButton{ position:absolute; left:50%; bottom:120px; transform:translateX(-50%); z-index:20; border:0; border-radius:18px; padding:15px 24px; background:#d9a441; color:#111; font-size:15px; font-weight:800; box-shadow:0 6px 25px rgba(0,0,0,.45); } /* NORMAL CONTROLS */ #controls{ position:absolute; left:50%; bottom:calc(15px + env(safe-area-inset-bottom,0)); transform:translateX(-50%); z-index:20; display:flex; gap:7px; padding:8px; border-radius:20px; background:rgba(0,0,0,.82); backdrop-filter:blur(10px); } .control{ width:45px; height:45px; border:0; border-radius:13px; background:#303030; color:white; font-size:20px; font-weight:bold; } /* AR INTERFACE */ #arUI{ display:none; position:fixed; inset:0; z-index:100; pointer-events:none; } #arUI.active{ display:block; } /* AR TITLE */ #arTitle{ position:absolute; top:calc(14px + env(safe-area-inset-top,0)); left:50%; transform:translateX(-50%); padding:8px 14px; border-radius:20px; background:rgba(0,0,0,.7); color:white; font-size:11px; white-space:nowrap; } /* CLOSE */ #closeAR{ position:absolute; top:calc(12px + env(safe-area-inset-top,0)); right:14px; width:43px; height:43px; border:0; border-radius:50%; background:rgba(0,0,0,.8); color:white; font-size:25px; pointer-events:auto; } /* AR BOTTOM */ #arBottom{ position:absolute; left:0; right:0; bottom:calc(18px + env(safe-area-inset-bottom,0)); display:flex; align-items:center; justify-content:space-between; padding:0 18px; } /* CUBE */ #cubeButton{ width:64px; height:64px; border:0; border-radius:17px; background:rgba(0,0,0,.85); display:flex; align-items:center; justify-content:center; pointer-events:auto; touch-action:none; box-shadow:0 5px 20px rgba(0,0,0,.45); } #cube{ width:34px; height:34px; position:relative; transform-style:preserve-3d; transform:rotateX(-25deg) rotateY(35deg); } .face{ position:absolute; width:34px; height:34px; border:2px solid #111; background:#d9a441; } .front{transform:translateZ(17px)} .back{transform:rotateY(180deg) translateZ(17px)} .right{transform:rotateY(90deg) translateZ(17px);background:#b78327} .left{transform:rotateY(-90deg) translateZ(17px);background:#e7c36f} .top{transform:rotateX(90deg) translateZ(17px);background:#f1d58f} .bottom{transform:rotateX(-90deg) translateZ(17px);background:#8d651f} /* CAMERA */ #photoButton{ width:64px; height:64px; border:5px solid white; border-radius:50%; background:#111; color:white; font-size:27px; display:flex; align-items:center; justify-content:center; pointer-events:auto; box-shadow:0 5px 20px rgba(0,0,0,.45); } /* STATUS */ #status{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:200; display:none; max-width:85%; padding:14px 18px; border-radius:15px; background:rgba(0,0,0,.9); color:white; font-size:13px; text-align:center; } #status.show{display:block} /* FLASH */ #flash{ position:fixed; inset:0; background:white; opacity:0; pointer-events:none; z-index:500; } #flash.active{ animation:flash .25s ease; } @keyframes flash{ 0%{opacity:0} 30%{opacity:.9} 100%{opacity:0} } @media(max-width:380px){ #cubeButton,#photoButton{ width:56px; height:56px; } } </style> </head> <body> <div id="app">
<header>
    <h1>Mayan Sculpture</h1>
    <p>Explore the sculpture in augmented reality</p>
</header>

<model-viewer
    id="model"
    src="./escultura.glb"
    alt="Mayan sculpture"

    ar
    ar-modes="webxr scene-viewer quick-look"

    camera-controls
    touch-action="none"

    shadow-intensity="1"
    shadow-softness=".7"
    exposure="1"

    environment-image="neutral"

    camera-orbit="0deg 75deg 3m"
    min-camera-orbit="auto 10deg .5m"
    max-camera-orbit="auto 170deg 10m"

    field-of-view="30deg">

    <button
        slot="ar-button"
        id="arButton">
        📱 VIEW IN MY SPACE
    </button>

</model-viewer>


<!-- NORMAL CONTROLS -->

<div id="controls">

    <button class="control" id="reset">🎯</button>

    <button class="control" id="left">↶</button>

    <button class="control" id="right">↷</button>

    <button class="control" id="zoomOut">−</button>

    <button class="control" id="zoomIn">+</button>

</div>


<!-- AR CONTROLS -->

<div id="arUI">

    <div id="arTitle">
        MAYAN SCULPTURE · AR
    </div>

    <button id="closeAR">×</button>

    <div id="arBottom">

        <!-- ROTATION CUBE -->

        <button id="cubeButton">

            <div id="cube">

                <div class="face front"></div>
                <div class="face back"></div>
                <div class="face right"></div>
                <div class="face left"></div>
                <div class="face top"></div>
                <div class="face bottom"></div>

            </div>

        </button>


        <!-- CAMERA -->

        <button id="photoButton">
            📷
        </button>

    </div>

</div>


<div id="status"></div>

<div id="flash"></div>

</div> <script> const model = document.getElementById("model"); const controls = document.getElementById("controls"); const arUI = document.getElementById("arUI"); const reset = document.getElementById("reset"); const left = document.getElementById("left"); const right = document.getElementById("right"); const zoomIn = document.getElementById("zoomIn"); const zoomOut = document.getElementById("zoomOut"); const cubeButton = document.getElementById("cubeButton"); const cube = document.getElementById("cube"); const photoButton = document.getElementById("photoButton"); const closeAR = document.getElementById("closeAR"); const status = document.getElementById("status"); const flash = document.getElementById("flash"); /* STATUS */ let statusTimer; function showStatus(message,time=2500){ status.textContent=message; status.classList.add("show"); clearTimeout(statusTimer); statusTimer=setTimeout(()=>{ status.classList.remove("show"); },time); } /* RESET */ reset.addEventListener("click",()=>{ model.cameraOrbit="0deg 75deg 3m"; model.fieldOfView="30deg"; }); /* ROTATE */ function rotateModel(degrees){ const orbit= model.getCameraOrbit(); const theta= orbit.theta+ degrees*Math.PI/180; model.cameraOrbit= `${theta}rad ${orbit.phi}rad ${orbit.radius}m`; } left.addEventListener("click",()=>{ rotateModel(-30); }); right.addEventListener("click",()=>{ rotateModel(30); }); /* ZOOM */ function zoom(factor){ const orbit= model.getCameraOrbit(); let radius= orbit.radius*factor; radius= Math.max(.5,Math.min(10,radius)); model.cameraOrbit= `${orbit.theta}rad ${orbit.phi}rad ${radius}m`; } zoomIn.addEventListener("click",()=>{ zoom(.8); }); zoomOut.addEventListener("click",()=>{ zoom(1.25); }); /* AR STATUS */ model.addEventListener("ar-status",event=>{ const state= event.detail.status; console.log("AR:",state); if(state==="session-started"){ controls.style.display="none"; arUI.classList.add("active"); showStatus( "Move your phone to find a surface.", 3000 ); } if(state==="not-presenting"){ controls.style.display="flex"; arUI.classList.remove("active"); } }); /* CLOSE AR */ closeAR.addEventListener("click",()=>{ /* model-viewer will close the AR session when the user leaves the AR presentation. */ arUI.classList.remove("active"); controls.style.display="flex"; }); /* CUBE */ let dragging=false; let lastX=0; let lastY=0; let cubeX=-25; let cubeY=35; cubeButton.addEventListener("pointerdown",event=>{ dragging=true; lastX=event.clientX; lastY=event.clientY; cubeButton.setPointerCapture( event.pointerId ); }); cubeButton.addEventListener("pointermove",event=>{ if(!dragging)return; const dx= event.clientX-lastX; const dy= event.clientY-lastY; lastX=event.clientX; lastY=event.clientY; cubeY+=dx*.8; cubeX-=dy*.8; cubeX= Math.max(-80,Math.min(80,cubeX)); cube.style.transform= `rotateX(${cubeX}deg) rotateY(${cubeY}deg)`; }); function stopCube(){ dragging=false; } cubeButton.addEventListener( "pointerup", stopCube ); cubeButton.addEventListener( "pointercancel", stopCube ); /* PHOTO */ photoButton.addEventListener("click",async()=>{ flash.classList.remove("active"); void flash.offsetWidth; flash.classList.add("active"); try{ if(typeof model.toBlob!=="function"){ throw new Error("Photo unavailable"); } const blob= await model.toBlob({ idealAspect:1, mimeType:"image/png" }); if(!blob){ throw new Error("Image unavailable"); } const url= URL.createObjectURL(blob); const link= document.createElement("a"); link.href=url; link.download= `mayan-sculpture-${Date.now()}.png`; document.body.appendChild(link); link.click(); link.remove(); setTimeout(()=>{ URL.revokeObjectURL(url); },2000); showStatus("Photo saved.",2000); }catch(error){ console.error(error); showStatus( "Photo capture is not available on this browser.", 3500 ); } }); /* MODEL LOADED */ model.addEventListener("load",()=>{ model.cameraOrbit= "0deg 75deg 3m"; }); </script> </body> </html>
