<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Sculpture</title>
  
  <!-- Load model-viewer (no build step, no npm) -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

  <style>
    /* Minimal reset to ensure it fills the screen on mobile */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff; /* Clean white background as requested */
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Error message container (hidden by default) */
    #error-message {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: #ffebee;
      color: #c62828;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      max-width: 80%;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      z-index: 100;
    }

    /* Future UI containers (Phase 2+) - currently hidden or minimal */
    #ui-layer {
      position: absolute;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
    }
  </style>
</head>
<body>

  <!-- Error handling container -->
  <div id="error-message" role="alert">
    <strong>Error:</strong> <span id="error-text">Failed to load 3D model.</span>
    <br><br>
    <button onclick="location.reload()" style="padding: 8px 16px; background: #c62828; color: white; border: none; border-radius: 4px; cursor: pointer;">
      Reload Page
    </button>
  </div>

  <!-- 
    Baseline model-viewer 
    - ar-modes prioritizes scene-viewer (native Android ARCore) then webxr.
    - environment-image="neutral" ensures consistent lighting on the white background.
  -->
  <model-viewer 
    id="ar-model"
    src="./escultura.glb" 
    alt="A 3D model of a sculpture"
    ar 
    ar-modes="scene-viewer webxr" 
    camera-controls 
    shadow-intensity="1"
    exposure="1"
    environment-image="neutral"
    interaction-prompt="auto">
    
    <!-- Navigation cube is natively handled by model-viewer's camera-controls.
         We will style its position in later phases if needed, but it defaults 
         to a non-obtrusive position that works well on mobile. -->

  </model-viewer>

  <!-- UI Layer placeholder for Phase 2 (Photo/AR buttons) -->
  <div id="ui-layer">
    <!-- Buttons will be injected here in Phase 2 -->
  </div>

  <script>
    // Phase 1: Robust Error Handling
    // Prevents the "infinite loading" state if the GLB is missing or corrupt.
    const modelViewer = document.querySelector('#ar-model');
    const errorMessage = document.querySelector('#error-message');
    const errorText = document.querySelector('#error-text');

    modelViewer.addEventListener('error', (event) => {
      console.error('[Model Viewer Error]', event);
      errorText.textContent = 'Failed to load the 3D model. Please check the file path (./escultura.glb) and ensure you are using a secure (HTTPS) connection.';
      errorMessage.style.display = 'block';
    });

    modelViewer.addEventListener('load', () => {
      console.log('[Model Viewer] Model loaded successfully.');
      // Ensure error message is hidden if a previous error occurred and model was retried
      errorMessage.style.display = 'none';
    });

    // Log environment info for debugging Android devices later
    console.log('[App Init] User Agent:', navigator.userAgent);
    console.log('[App Init] Secure Context:', window.isSecureContext ? 'Yes' : 'No');
  </script>

</body>
</html>
