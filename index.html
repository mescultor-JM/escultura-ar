<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Escultura Maya AR</title>

    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>

    <style>

        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin: 20px 0 5px;
        }

        p {
            color: #ccc;
        }

        model-viewer {
            width: 100%;
            height: 70vh;
            background: #222;
        }

        .boton {
            margin: 15px;
            padding: 16px 25px;
            border: none;
            border-radius: 10px;
            background: #ffffff;
            color: #111;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

    </style>

</head>

<body>

    <h1>Escultura Maya</h1>

    <p>Explora la escultura en 3D</p>

    <model-viewer

        src="./escultura.glb"

        alt="Escultura Maya"

        ar

        ar-modes="webxr scene-viewer quick-look"

        camera-controls

        auto-rotate

        shadow-intensity="1"

        exposure="1">

        <button
            slot="ar-button"
            class="boton">

            📱 VER EN MI ESPACIO

        </button>

    </model-viewer>

</body>

</html>
